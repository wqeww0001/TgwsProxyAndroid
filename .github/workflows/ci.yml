name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" || true

      - name: Test Rust core
        run: cargo test --locked

      - name: Build Android native libraries
        run: |
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR="$ANDROID_NDK_ROOT"
          fi
          export ANDROID_NDK_HOME="$NDK_DIR"
          echo "Using ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o app/src/main/jniLibs build --release --locked

      - name: Prepare Release Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > tgwsproxy-release.jks
          else
            STORE_PASS="${RELEASE_STORE_PASSWORD:-tgwsproxy_release_2026}"
            KEY_PASS="${RELEASE_KEY_PASSWORD:-$STORE_PASS}"
            ALIAS_NAME="${RELEASE_KEY_ALIAS:-tgwsproxy}"
            keytool -genkeypair -v \
              -keystore tgwsproxy-release.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$ALIAS_NAME" \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=TgwsProxyAndroid, OU=Mobile, O=TgwsProxy, L=Internet, S=Global, C=US"
            echo "RELEASE_STORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$ALIAS_NAME" >> "$GITHUB_ENV"
          fi

      - name: Test, lint and build Android app
        env:
          RELEASE_STORE_PASSWORD: ${{ env.RELEASE_STORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS || secrets.RELEASE_KEY_ALIAS || 'tgwsproxy' }}
          RELEASE_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          cp "$APK_PATH" "app-release.apk"
          cp "$APK_PATH" "TgwsProxyAndroid-${TAG_NAME}.apk"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "app-release.apk" "TgwsProxyAndroid-${TAG_NAME}.apk" --clobber
          else
            gh release create "$TAG_NAME" "app-release.apk" "TgwsProxyAndroid-${TAG_NAME}.apk" \
              --title "TgwsProxyAndroid ${TAG_NAME}" \
              --generate-notes
          fi

