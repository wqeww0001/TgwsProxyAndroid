name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install prebuilt cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" || true

      - name: Test Rust core
        run: cargo test --locked

      - name: Build native libraries for every ABI
        run: |
          NDK_DIR=$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            NDK_DIR="$ANDROID_NDK_ROOT"
          fi
          export ANDROID_NDK_HOME="$NDK_DIR"
          echo "Using ANDROID_NDK_HOME: $ANDROID_NDK_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o app/src/main/jniLibs build --release --locked

      - name: Verify native library exports
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            lib="app/src/main/jniLibs/$abi/libtgwsproxy.so"
            for sym in StartProxy StopProxy IsListening; do
              if ! grep -q "$sym" "$lib"; then
                echo "::error::$lib does not export $sym"
                exit 1
              fi
            done
          done

      - name: Prepare release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > tgwsproxy-release.jks
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is required for tagged releases" >&2
            exit 1
          fi

      - name: Build APK
        env:
          RELEASE_REQUIRED: ${{ startsWith(github.ref, 'refs/tags/v') && 'true' || 'false' }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'tgwsproxy' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --build-cache --parallel -x lint --stacktrace
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ./gradlew assembleRelease --build-cache --parallel -x lint --stacktrace
          fi

      - name: Upload release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release-apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION_NUM="${TAG_NAME#v}"
          cp release-apk/app-release.apk "app-release.apk"
          cp release-apk/app-release.apk "TgwsProxyAndroid-${TAG_NAME}.apk"
          awk -v ver="$VERSION_NUM" '
            $0 ~ "^## " ver "($| )" { flag=1; print "# Что нового в TgwsProxyAndroid v" ver "\n"; next }
            /^## / && flag { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md || true
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "app-release.apk" "TgwsProxyAndroid-${TAG_NAME}.apk" --clobber
            if [ -s release_notes.md ]; then
              gh release edit "$TAG_NAME" --title "TgwsProxyAndroid ${TAG_NAME}" --notes-file release_notes.md
            fi
          else
            if [ -s release_notes.md ]; then
              gh release create "$TAG_NAME" "app-release.apk" "TgwsProxyAndroid-${TAG_NAME}.apk" \
                --title "TgwsProxyAndroid ${TAG_NAME}" --notes-file release_notes.md
            else
              gh release create "$TAG_NAME" "app-release.apk" "TgwsProxyAndroid-${TAG_NAME}.apk" \
                --title "TgwsProxyAndroid ${TAG_NAME}" --generate-notes
            fi
          fi
